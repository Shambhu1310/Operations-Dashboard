<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OpsLift – Elevator Operations & Capacity Dashboard">
  <title>OpsLift – Elevator Operations & Capacity Dashboard</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="full-dashboard-app">

    <!-- ==========================================
         1. TOP EXECUTIVE NAVBAR & BRAND
         ========================================== -->
    <header class="top-navbar">
      <div class="nav-brand-section">
        <div class="brand-icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="12" y1="3" x2="12" y2="21"></line>
            <polyline points="7 10 9 7 11 10"></polyline>
            <polyline points="13 14 15 17 17 14"></polyline>
          </svg>
        </div>
        <div class="brand-text-wrap">
          <div class="brand-title-row">
            <span class="brand-title">OpsLift</span>
            <span class="brand-badge">Operations Management Dashboard</span>
          </div>
          <span class="brand-subtitle" id="topNavSubtitle">Elevator Operations & Capacity Monitoring</span>
        </div>
      </div>

      <div class="nav-meta-badges">
        <span class="meta-pill" id="topNavBuildingPill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          <span id="topNavBuildingText">Demo Institutional Building &bull; 3 Elevators</span>
        </span>
        <span class="meta-pill dataset-pill" id="topNavDatasetPill">
          <span class="pulse-dot"></span>
          <span id="topNavDatasetText">Dataset: Simulated Operational Data</span>
        </span>
      </div>
    </header>

    <!-- ==========================================
         2. HORIZONTAL TOP NAVIGATION BAR
         ========================================== -->
    <nav class="top-nav-tabs-bar" aria-label="Dashboard Modules Navigation">
      <div class="nav-tabs-list">
        <button class="nav-tab-btn active" data-page="executive-overview">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
          Executive Overview
        </button>
        <button class="nav-tab-btn" data-page="capacity-analysis">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-6"></path></svg>
          Capacity Analysis
        </button>
        <button class="nav-tab-btn" data-page="traffic-flow">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
          Traffic & Flow
        </button>
        <button class="nav-tab-btn" data-page="floor-analysis">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          Floor Analysis
        </button>
        <button class="nav-tab-btn" data-page="elevator-performance">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Elevator Performance
        </button>
        <button class="nav-tab-btn" data-page="decision-support">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          Decision Support
        </button>
        <button class="nav-tab-btn tab-case-study" data-page="great-lakes">
          <span class="case-study-star">&#9733;</span>
          Great Lakes &ndash; Academic Block A
        </button>
        <button class="nav-tab-btn" data-page="data-management">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
          Data Management
        </button>
      </div>
    </nav>

    <!-- ==========================================
         3. DYNAMIC FILTER TOOLBAR
         ========================================== -->
    <div class="filter-toolbar-container" id="globalFilterToolbar">
      <!-- Standard Simulated Filters -->
      <div class="filter-controls-group" id="simulatedFilterGroup">
        <div class="filter-item">
          <label for="globalDateFilter">Date:</label>
          <select class="filter-select" id="globalDateFilter"></select>
        </div>

        <div class="filter-item">
          <label for="globalPeriodFilter">Traffic Period:</label>
          <select class="filter-select" id="globalPeriodFilter"></select>
        </div>

        <div class="filter-item" id="filterItemElevator" style="display: none;">
          <label for="globalElevatorFilter">Elevator:</label>
          <select class="filter-select" id="globalElevatorFilter">
            <option value="all" selected>All Elevators (E1, E2, E3)</option>
            <option value="E1">Elevator 1 (E1)</option>
            <option value="E2">Elevator 2 (E2)</option>
            <option value="E3">Elevator 3 (E3)</option>
          </select>
        </div>
      </div>

      <!-- Great Lakes Case Study Filters -->
      <div class="filter-controls-group" id="greatLakesFilterGroup" style="display: none;">
        <div class="filter-item">
          <label for="glDayFilter">Day / Date:</label>
          <select class="filter-select" id="glDayFilter">
            <option value="all" selected>All Timetable Days</option>
            <option value="Monday">Monday (Aug 10)</option>
            <option value="Tuesday">Tuesday (Aug 11)</option>
            <option value="Wednesday">Wednesday (Aug 12)</option>
            <option value="Thursday">Thursday (Aug 13)</option>
            <option value="Friday">Friday (Aug 14)</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="glBatchFilter">Programme:</label>
          <select class="filter-select" id="glBatchFilter">
            <option value="all" selected>All Programmes</option>
            <option value="PGPM">PGPM (130 students, 2 Sec)</option>
            <option value="PGDM 1">PGDM 1 (360 students, 6 Sec)</option>
            <option value="PGDM 2">PGDM 2 (300 students, 5 Sec)</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="glFloorFilter">Floor:</label>
          <select class="filter-select" id="glFloorFilter">
            <option value="all" selected>All Floors (1, 2, 3)</option>
            <option value="1">Floor 1 (Room A17)</option>
            <option value="2">Floor 2 (Rooms A24, A25)</option>
            <option value="3">Floor 3 (Rooms A33, A34)</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="glScenarioFilter">Adoption Scenario:</label>
          <select class="filter-select highlight-select" id="glScenarioFilter">
            <option value="0.15">15% Conservative</option>
            <option value="0.25" selected>25% Base (Default)</option>
            <option value="0.35">35% High Demand</option>
          </select>
        </div>

        <div class="filter-item">
          <label for="glDirectionFilter">Direction:</label>
          <select class="filter-select" id="glDirectionFilter">
            <option value="all" selected>All Directions</option>
            <option value="Up">Upward (Class Start)</option>
            <option value="Down">Downward (Class End)</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn-reset" id="globalResetBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
        Reset Filters
      </button>
    </div>

    <!-- ==========================================
         4. DYNAMIC PAGE CONTENT CONTAINER
         ========================================== -->
    <main class="dashboard-body" id="pageContentContainer"></main>

  </div>

  <!-- Application Dataset & Controllers -->
  <script src="js/dataset.js"></script>
  <script src="js/great_lakes_data.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/pages.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OpsPages.init();
    });
  </script>
</body>
</html>
